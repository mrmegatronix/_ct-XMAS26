<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- Tiki Mask -->
  <symbol id="icon-tiki-mask" viewBox="0 0 100 120">
    <path d="M20,10 Q50,0 80,10 L75,110 Q50,118 25,110 Z" fill="#78350f" stroke="#f59e0b" stroke-width="3"/>
    <!-- Forehead carve -->
    <path d="M30,22 Q50,30 70,22" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Eyes -->
    <polygon points="28,38 45,45 32,55" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <polygon points="72,38 55,45 68,55" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="37" cy="45" r="3" fill="#1e1b4b"/>
    <circle cx="63" cy="45" r="3" fill="#1e1b4b"/>
    <!-- Nose -->
    <polygon points="50,42 43,72 57,72" fill="#92400e" stroke="#fbbf24" stroke-width="2"/>
    <!-- Mouth / Grimace -->
    <path d="M28,82 Q50,95 72,82 L70,98 Q50,110 30,98 Z" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <!-- Teeth -->
    <polygon points="34,85 39,94 44,87" fill="#fef3c7"/>
    <polygon points="46,87 50,96 54,87" fill="#fef3c7"/>
    <polygon points="56,87 61,94 66,85" fill="#fef3c7"/>
    <polygon points="36,98 41,91 46,97" fill="#fef3c7"/>
    <polygon points="54,97 59,91 64,98" fill="#fef3c7"/>
  </symbol>

  <!-- Tropical Hibiscus Flower -->
  <symbol id="icon-hibiscus" viewBox="0 0 100 100">
    <g fill="#f43f5e" stroke="#be123c" stroke-width="1.5">
      <ellipse cx="50" cy="28" rx="16" ry="24"/>
      <ellipse cx="72" cy="45" rx="24" ry="16"/>
      <ellipse cx="64" cy="74" rx="22" ry="17"/>
      <ellipse cx="36" cy="74" rx="22" ry="17"/>
      <ellipse cx="28" cy="45" rx="24" ry="16"/>
    </g>
    <!-- Stamen -->
    <path d="M50,55 Q56,35 68,20" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="64" cy="25" r="3" fill="#fbbf24"/>
    <circle cx="60" cy="30" r="2.5" fill="#fde047"/>
    <circle cx="50" cy="50" r="9" fill="#be123c"/>
  </symbol>

  <!-- Palm Leaves -->
  <symbol id="icon-palm" viewBox="0 0 100 100">
    <path d="M50,90 Q45,50 15,25 Q35,45 48,60 Q30,20 50,5 Q55,30 52,65 Q70,20 85,25 Q65,50 54,75" fill="#15803d" stroke="#14532d" stroke-width="1.5"/>
  </symbol>

  <!-- Tiki Torch -->
  <symbol id="icon-torch" viewBox="0 0 100 120">
    <rect x="46" y="55" width="8" height="60" rx="3" fill="#854d0e" stroke="#451a03" stroke-width="2"/>
    <polygon points="35,35 65,35 58,60 42,60" fill="#a16207" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,5 Q65,22 55,35 Q45,28 35,35 Q40,18 50,5 Z" fill="#ef4444">
      <animate attributeName="d" 
        values="M50,5 Q65,22 55,35 Q45,28 35,35 Q40,18 50,5 Z;
                M50,2 Q68,20 58,35 Q43,26 33,35 Q38,15 50,2 Z;
                M50,5 Q65,22 55,35 Q45,28 35,35 Q40,18 50,5 Z" 
        dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M50,15 Q58,26 53,35 Q46,30 42,35 Q45,22 50,15 Z" fill="#facc15"/>
  </symbol>

  <!-- Christmas Santa Hat on Palm/Tiki -->
  <symbol id="icon-santa-hat" viewBox="0 0 100 80">
    <path d="M20,60 Q50,15 80,45 Q70,25 35,20 Z" fill="#dc2626"/>
    <ellipse cx="80" cy="45" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="15" y="55" width="55" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </symbol>

  <!-- Mai Tai Drink -->
  <symbol id="drink-maitai" viewBox="0 0 100 130">
    <!-- Glass -->
    <path d="M30,30 L35,105 Q35,115 50,115 Q65,115 65,105 L70,30 Z" fill="rgba(255,255,255,0.18)" stroke="#fcd34d" stroke-width="2"/>
    <!-- Liquid Layers -->
    <path d="M33,65 L35,105 Q35,113 50,113 Q65,113 65,105 L67,65 Z" fill="#f59e0b"/>
    <path d="M32,45 L33,65 L67,65 L68,45 Z" fill="#d97706"/>
    <path d="M31,35 L32,45 L68,45 L69,35 Z" fill="#78350f"/>
    <!-- Ice cubes -->
    <rect x="40" y="55" width="12" height="12" rx="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="52" y="70" width="10" height="10" rx="3" fill="rgba(255,255,255,0.6)"/>
    <!-- Garnish Umbrella & Mint -->
    <line x1="50" y1="55" x2="25" y2="15" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="15,18 35,10 40,25" fill="#fb7185"/>
    <circle cx="58" cy="28" r="7" fill="#dc2626"/>
    <path d="M62,30 Q75,18 78,28 Q70,35 62,30 Z" fill="#22c55e"/>
  </symbol>

  <!-- Blue Hawaiian Drink -->
  <symbol id="drink-bluehawaii" viewBox="0 0 100 130">
    <!-- Hurricane stem glass -->
    <path d="M32,25 Q25,50 36,75 Q42,90 48,98 L48,115 L35,120 L65,120 L52,115 L52,98 Q58,90 64,75 Q75,50 68,25 Z" fill="rgba(6,182,212,0.75)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Froth & Coconut rim -->
    <ellipse cx="50" cy="25" rx="18" ry="4" fill="#ffffff"/>
    <line x1="52" y1="25" x2="65" y2="5" stroke="#f59e0b" stroke-width="3"/>
    <!-- Pineapple slice -->
    <polygon points="30,10 45,25 25,30" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="68" cy="28" r="6" fill="#e11d48"/>
  </symbol>

  <!-- Tiki Sunrise Drink -->
  <symbol id="drink-sunrise" viewBox="0 0 100 130">
    <path d="M32,20 L36,110 L64,110 L68,20 Z" fill="rgba(255,255,255,0.15)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Ombre Liquid -->
    <path d="M36,85 L36,108 L64,108 L64,85 Z" fill="#e11d48"/>
    <path d="M35,55 L36,85 L64,85 L65,55 Z" fill="#f97316"/>
    <path d="M33,25 L35,55 L65,55 L67,25 Z" fill="#facc15"/>
    <!-- Orange wheel garnish -->
    <circle cx="34" cy="22" r="14" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
    <circle cx="34" cy="22" r="10" fill="#fdba74"/>
    <line x1="48" y1="110" x2="60" y2="10" stroke="#10b981" stroke-width="3"/>
  </symbol>

  <!-- Coconut Colada Drink -->
  <symbol id="drink-colada" viewBox="0 0 100 130">
    <!-- Coconut Cup -->
    <ellipse cx="50" cy="65" rx="32" ry="34" fill="#582f0e" stroke="#371d07" stroke-width="3"/>
    <ellipse cx="50" cy="45" rx="28" ry="14" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
    <!-- Cream Foam -->
    <ellipse cx="50" cy="42" rx="25" ry="10" fill="#ffffff"/>
    <!-- Nutmeg sprinkle dots -->
    <circle cx="48" cy="40" r="1" fill="#78350f"/>
    <circle cx="53" cy="43" r="1" fill="#78350f"/>
    <circle cx="45" cy="44" r="1" fill="#78350f"/>
    <circle cx="56" cy="39" r="1" fill="#78350f"/>
    <!-- Straw & Flower -->
    <line x1="45" y1="42" x2="35" y2="15" stroke="#ef4444" stroke-width="3"/>
    <circle cx="65" cy="40" r="8" fill="#f43f5e"/>
  </symbol>
</svg>
